services:
  - type: web
    name: compare-live-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: compare-live-cache
          property: connectionString

  - type: keyvalue
    name: compare-live-cache
    plan: free
